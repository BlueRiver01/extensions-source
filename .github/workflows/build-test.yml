name: Build Extension APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :src:en:erosscans:spotlessApply
          ./gradlew :src:en:erosscans:assembleDebug -x spotlessCheck -x spotlessKotlinCheck

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scythescans-debug-apk
          path: src/en/erosscans/build/outputs/apk/debug/*.apk